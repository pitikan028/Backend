# HTTPS สำหรับขึ้นใช้งานจริง — เปิดใช้ด้วย docker-compose.https.yml
#
# ต้องมีไฟล์ certificate สองไฟล์ในโฟลเดอร์ infra/certs/
#   fullchain.pem   certificate + intermediate chain
#   privkey.pem     private key
# (ชื่อไฟล์เดียวกับที่ Let's Encrypt / certbot สร้างให้)

# HTTP → HTTPS
server {
    listen 80;
    server_name _;

    # ให้ certbot ต่ออายุ certificate แบบ webroot ได้โดยไม่ต้องหยุดเว็บ
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # บอกเบราว์เซอร์ให้ใช้ HTTPS กับโดเมนนี้เสมอ (1 ปี) — ส่งออกผ่าน snippets/security-headers.inc
    set $hsts_header "max-age=31536000";

    include /etc/nginx/snippets/site.inc;
}
