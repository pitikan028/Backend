<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- ภาษาที่ผู้ใช้เลือก (EN/TH) ต้องรู้ก่อนวาดหน้า ดู js/i18n.js -->
<script src="js/lang-boot.js"></script>
<title>My Booking | Chokchai Elephant Camp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-page="booking" class="bg-cream text-dark font-sans min-h-screen flex flex-col">

<div id="site-header"></div>

<main class="flex-1 w-full max-w-3xl mx-auto px-6 py-12 flex flex-col gap-6">
  <div class="text-center">
    <h1 class="font-script text-forest-dark text-4xl lg:text-5xl">Check your booking</h1>
    <p class="text-sm text-gray-500 mt-2">Enter your booking reference and the email you booked with to view the status, pay or cancel your booking.</p>
  </div>

  <!-- GET /api/bookings/:ref?email=... -->
  <form id="lookup-form" class="bg-white rounded-2xl border border-gray-200 p-6 grid sm:grid-cols-[1fr_1.4fr_auto] gap-4 items-end" novalidate>
    <div>
      <label for="lookup-ref" class="text-sm font-semibold block mb-2">Booking reference</label>
      <input id="lookup-ref" name="ref" type="text" maxlength="16" placeholder="CEC-XXXXXX" autocapitalize="characters" required
             class="w-full border border-gray-300 rounded-lg px-4 py-3 bg-cream font-mono uppercase focus:outline-none focus:border-gold" />
    </div>
    <div>
      <label for="lookup-email" class="text-sm font-semibold block mb-2">Email used for booking</label>
      <input id="lookup-email" name="email" type="email" maxlength="160" autocomplete="email" required
             class="w-full border border-gray-300 rounded-lg px-4 py-3 bg-cream focus:outline-none focus:border-gold" />
    </div>
    <button type="submit" class="bg-forest hover:bg-forest-dark text-white font-bold px-7 py-3 rounded-lg transition">Search</button>
  </form>

  <p id="page-message" class="hidden" role="status"></p>
  <section id="booking-result" aria-live="polite"></section>

  <p class="text-center text-sm text-gray-500">
    Already a member? <a href="account.html" class="font-semibold text-forest hover:underline">See all your bookings in My Account</a>
  </p>
</main>

<div id="site-footer"></div>

<script type="module" src="js/pages.js"></script>
</body>
</html>
