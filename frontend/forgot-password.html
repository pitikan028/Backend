<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- ภาษาที่ผู้ใช้เลือก (EN/TH) ต้องรู้ก่อนวาดหน้า ดู js/i18n.js -->
<script src="js/lang-boot.js"></script>
<title>Reset password | Chokchai Elephant Camp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-page="forgot" class="bg-cream text-dark font-sans min-h-screen flex flex-col">

<div id="site-header"></div>

<main class="flex-1 flex items-start justify-center px-6 py-14">
  <div class="bg-white rounded-2xl shadow-lg border border-gray-200 p-8 lg:p-10 w-full max-w-md flex flex-col gap-5">
    <div class="text-center">
      <h1 class="font-script text-forest-dark text-4xl">Reset password</h1>
      <p class="text-sm text-gray-500 mt-1">We will email you a verification code</p>
    </div>

    <p id="form-message" class="hidden" role="alert"></p>

    <!-- ขั้นที่ 1: ขอรหัสยืนยัน — POST /api/account/password/forgot -->
    <form id="forgot-form" class="flex flex-col gap-5" novalidate>
      <div>
        <label for="forgot-email" class="text-sm font-semibold block mb-2">Email</label>
        <input id="forgot-email" name="email" type="email" maxlength="160" autocomplete="email" required
               class="w-full border border-gray-300 rounded-lg px-4 py-3 bg-cream focus:outline-none focus:border-gold" />
      </div>
      <button type="submit" class="bg-forest hover:bg-forest-dark text-white font-bold py-3.5 rounded-lg transition">
        Send verification code
      </button>
    </form>

    <!-- ขั้นที่ 2: กรอกรหัสและรหัสผ่านใหม่ — POST /api/account/password/reset -->
    <form id="reset-form" class="hidden flex flex-col gap-5" novalidate>
      <div>
        <label for="reset-code" class="text-sm font-semibold block mb-2">Verification code</label>
        <input id="reset-code" name="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required
               class="w-full border border-gray-300 rounded-lg px-4 py-3 bg-cream focus:outline-none focus:border-gold" />
      </div>
      <div>
        <label for="reset-password" class="text-sm font-semibold block mb-2">New password</label>
        <input id="reset-password" name="new_password" type="password" minlength="8" maxlength="200" autocomplete="new-password" required
               class="w-full border border-gray-300 rounded-lg px-4 py-3 bg-cream focus:outline-none focus:border-gold" />
        <p class="text-sm text-gray-500 mt-1">At least 8 characters, including both letters and numbers</p>
      </div>
      <div>
        <label for="reset-password-confirm" class="text-sm font-semibold block mb-2">Confirm new password</label>
        <input id="reset-password-confirm" name="password_confirm" type="password" maxlength="200" autocomplete="new-password" required
               class="w-full border border-gray-300 rounded-lg px-4 py-3 bg-cream focus:outline-none focus:border-gold" />
      </div>
      <button type="submit" class="bg-forest hover:bg-forest-dark text-white font-bold py-3.5 rounded-lg transition">
        Set new password
      </button>
      <button type="button" id="resend-code" class="text-center text-sm font-semibold text-forest hover:underline">
        Send a new code
      </button>
    </form>

    <p class="text-center text-sm text-gray-600">
      <a href="login.html" class="font-bold text-forest hover:underline">Back to log in</a>
    </p>
  </div>
</main>

<div id="site-footer"></div>

<script type="module" src="js/pages.js"></script>
</body>
</html>
