<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- ภาษาที่ผู้ใช้เลือก (EN/TH) ต้องรู้ก่อนวาดหน้า ดู js/i18n.js -->
<script src="js/lang-boot.js"></script>
<title>Activity Details | Chokchai Elephant Camp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-page="activity" class="bg-cream text-dark font-sans min-h-screen flex flex-col">

<div id="site-header"></div>

<main class="flex-1 w-full max-w-6xl mx-auto px-6 lg:px-10 py-10">
  <a href="activities.html" class="group inline-flex items-center gap-2.5 text-sm font-semibold text-forest hover:text-forest-dark transition">
    <span class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-forest/30 bg-white shadow-sm transition group-hover:bg-forest group-hover:text-white group-hover:border-forest group-hover:-translate-x-0.5">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5" /><path d="m11 18-6-6 6-6" />
      </svg>
    </span>
    <span>All activities</span>
  </a>
  <!-- เนื้อหาสร้างจาก GET /api/activities/:slug โดย js/pages.js -->
  <section id="activity-detail" class="mt-6" aria-live="polite">
    <p class="text-center text-gray-400 text-sm py-16">Loading activity...</p>
  </section>
</main>

<div id="site-footer"></div>

<script type="module" src="js/pages.js"></script>
</body>
</html>
