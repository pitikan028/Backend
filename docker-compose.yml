name: chokchai

services:
  # ---------------------------------------------------------------
  # ฐานข้อมูลหลัก — เชื่อมจาก DBeaver ที่ localhost:5432
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: chokchai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-chokchai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chokchai}
      POSTGRES_DB: ${DB_NAME:-chokchai}
      # ตั้ง collation แบบ C ให้ผลการเรียงลำดับเหมือนกันทุกเครื่องที่รัน
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-chokchai} -d ${DB_NAME:-chokchai}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------
  # REST API (Node.js + Express + Knex)
  # ---------------------------------------------------------------
  api:
    build:
      context: ./backend
    container_name: chokchai-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_CLIENT: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-chokchai}
      DB_PASSWORD: ${DB_PASSWORD:-chokchai}
      DB_NAME: ${DB_NAME:-chokchai}
      JWT_SECRET: ${JWT_SECRET:?ต้องกำหนด JWT_SECRET ในไฟล์ .env ก่อนรัน}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@chokchai.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@1234}
      BOOKING_MIN_LEAD_DAYS: ${BOOKING_MIN_LEAD_DAYS:-1}
      BOOKING_MAX_ADVANCE_DAYS: ${BOOKING_MAX_ADVANCE_DAYS:-365}
      BOOKING_MAX_GUESTS: ${BOOKING_MAX_GUESTS:-30}
      # "วันนี้" ของกติกาการจองและรายงานต้องนับตามเวลาไทย ไม่ใช่ UTC ของ container
      TZ: Asia/Bangkok
      # URL ที่ลูกค้าเปิดเว็บ ใช้สร้างลิงก์ในอีเมลและหน้ากลับจากการชำระเงิน
      APP_URL: ${APP_URL:-http://localhost:8080}
      # mock = หน้าชำระเงินจำลอง (ไม่ตัดเงินจริง), stripe = Stripe Checkout, none = ปิดชำระออนไลน์
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # ค่าเริ่มต้นส่งอีเมลเข้า Mailpit (กล่องจดหมายทดสอบที่ http://localhost:8025)
      # ตอนใช้งานจริงให้ชี้ไป SMTP ของผู้ให้บริการอีเมลในไฟล์ .env
      SMTP_HOST: ${SMTP_HOST-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Chokchai Elephant Camp <no-reply@chokchai.local>}
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ---------------------------------------------------------------
  # เว็บ static + reverse proxy ไปที่ API
  # เปิดใช้งานที่ http://localhost:8080 (frontend กับ API อยู่โดเมนเดียวกัน จึงไม่ติด CORS)
  # ---------------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: chokchai-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro

  # ---------------------------------------------------------------
  # Mailpit — กล่องจดหมายทดสอบ ดักอีเมลทุกฉบับที่ระบบส่งไว้ให้เปิดดูที่ http://localhost:8025
  # ไม่มีอีเมลฉบับไหนถูกส่งออกไปหาลูกค้าจริง จนกว่าจะตั้ง SMTP_HOST เป็นของผู้ให้บริการจริง
  # ---------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: chokchai-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_PORT:-8025}:8025'

  # ---------------------------------------------------------------
  # MySQL — ทางเลือกสำรอง ไม่ได้เปิดโดยค่าเริ่มต้นเพื่อประหยัดพื้นที่ดิสก์
  #   เปิดด้วย:  docker compose --profile mysql up -d
  #   แล้วเปลี่ยน DB_CLIENT=mysql, DB_HOST=mysql, DB_PORT=3306 ให้ service api
  # ---------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: chokchai-mysql
    profiles: ['mysql']
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-chokchai}
      MYSQL_USER: ${DB_USER:-chokchai}
      MYSQL_PASSWORD: ${DB_PASSWORD:-chokchai}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD:-rootpassword}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres_data:
  mysql_data:
